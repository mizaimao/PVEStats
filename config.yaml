# Appearance. Editable here; changing it in the settings panel writes to
# ui.json instead, so the comments in this file survive. A setting changed
# in the panel then overrides its line here (only that one); delete ui.json
# to hand all of them back to this block.
#   theme: ice | midnight | neon | amber | synthwave | matrix | ember | nord
#          | glass | vista | win7 | snowleopard
#   glow:  0 = off, 1 = normal, 2.5 = maximum
#   window: seconds of history behind every chart
#   scanlines / grain / aurora: textural overlays, on or off
ui:
  theme: ice
  glow: 1.0
  window: 180
  scanlines: false
  grain: false
  aurora: false

# Card layout. `view` selects the panel set; VMIDs returned by PVE but absent
# from this file default to `basic` (spec §4.5), so only the special cases are
# listed here. VMIDs confirmed against captures/pve.json.
#
# Addresses are not set here. The agent's URL (ML60_AGENT_URL) and the NAS
# host (TRUENAS_HOST) live in .env beside the credentials that go with them.
hosts:
  - vmid: 222
    name: ml60
    view: gpu

  - vmid: 100
    name: FreeNAS
    view: nas
    # Override the auto-derived interface label. Detection reads the Proxmox
    # virtio MAC prefix and the reported media subtype, which cannot know what
    # hardware backs a virtual NIC.
    nic_labels:
      ens18: virtual (E610)
