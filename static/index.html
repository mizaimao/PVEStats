<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PVEStats</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <h1>PVEStats</h1>
  <div class="sources" id="sources"></div>
  <!-- Placeholder. Deliberately inert until there is something to configure. -->
  <button type="button" class="settings" id="settings"
          aria-label="Settings" title="Settings — not wired up yet">
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
      <circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor"
              stroke-width="1.8"/>
      <path fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round"
            d="M12 2.6v2.2M12 19.2v2.2M21.4 12h-2.2M4.8 12H2.6
               M18.6 5.4l-1.6 1.6M7 17l-1.6 1.6M18.6 18.6L17 17M7 7L5.4 5.4"/>
    </svg>
  </button>
</header>

<main>
  <section id="node-card" class="card card-node" hidden></section>
  <section id="feature" class="feature"></section>
  <section id="basics" class="grid-basic"></section>
</main>

<p class="offline" id="offline" hidden>
  Lost contact with the collector — showing the last known state.
</p>

<script src="/static/app.js"></script>
</body>
</html>
