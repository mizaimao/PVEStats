# Python here is only for probe.py, which needs nothing but the standard
# library, and for redrawing the app icon (tools/render_icon.py, the icon
# group). The Mac app (app/) and the dashboard (tui/) are Rust. Managed with
# tools/uv; uv.lock pins every installed package by hash. The ml60 agent has
# its own requirements in agent/, installed on ml60.
[project]
name = "pvestats"
version = "1.0"
description = "Read-only dashboard for a Proxmox VE host and its guests."
# 3.11 or newer; .python-version picks 3.13.
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
# Only for redrawing the app icon (tools/render_icon.py), so not installed
# into the .venv: `tools/uv run --group icon ...` brings it in.
icon = ["pillow"]

[tool.uv]
# An app, not a library: nothing to build or install from this folder.
package = false
# Only Pythons uv downloaded into .tools/python, never pyenv's, Homebrew's
# or the system's.
python-preference = "only-managed"
