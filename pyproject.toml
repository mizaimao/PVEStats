# The Mac side: collector, local server and window. Managed with tools/uv;
# uv.lock pins every package by hash. The ml60 agent has its own
# requirements in agent/, installed on ml60.
[project]
name = "pvestats"
version = "1.0"
description = "Read-only dashboard for a Proxmox VE host and its guests."
# 3.11 or newer; .python-version picks 3.13.
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    # Desktop window (app.py), in the OS's own webview: WKWebView on macOS,
    # WebView2 on Windows, WebKitGTK on Linux. Linux also needs system
    # packages; see README.
    "pywebview>=5.0",
]

[tool.uv]
# An app, not a library: nothing to build or install from this folder.
package = false
# Only Pythons uv downloaded into .tools/python, never pyenv's, Homebrew's
# or the system's.
python-preference = "only-managed"
