[package]
name = "pvestats-server"
version = "0.1.0"
edition = "2021"
description = "PVEStats' collector and local server in Rust, in place of pvestats/ (Python)"
publish = false

[dependencies]
# The terminal dashboard's own choices: blocking HTTP and WebSocket over
# rustls with the ring provider, no async runtime, one thread per source.
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
libc = "0.2"
# Keys in the order they were added, as Python's dicts keep them, so the
# replies match the Python server's byte for byte in layout.
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
