[package]
name = "pvestats-nas"
version = "0.1.0"
edition = "2021"
description = "TrueNAS's own counters as JSON over HTTP, read from the kernel and ZFS, for PVEStats' TrueNAS card"
publish = false

# The standard library only: nothing else to audit or keep up to date.
[dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
