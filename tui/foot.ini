# foot, the terminal that pvestats-kiosk.service shows full screen.
#
# The font size sets how big everything is. At 13 a 1920x1080 screen holds
# 190 x 47 characters (at 14, 173 x 45). Larger text means fewer columns, and under 150
# columns the dashboard drops from three columns of cards to two.
font=DejaVu Sans Mono:size=13
pad=6x4 center

[colors]
background=04070d

[mouse]
hide-when-typing=yes
