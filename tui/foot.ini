# foot, the terminal that pvestats-kiosk.service shows full screen.
#
# The font size sets how big everything is. At 14 a 1920x1080 screen holds
# about 174 x 49 characters. Larger text means fewer columns, and under 150
# columns the dashboard drops from three columns of cards to two.
font=DejaVu Sans Mono:size=14
pad=6x4 center

[colors]
background=04070d

[mouse]
hide-when-typing=yes
